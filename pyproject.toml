[project]
name = "vidgrab-engine"
version = "1.0.0"
description = "Local VidGrab download engine and browser companion backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "yt-dlp==2026.6.9",
    "websockets==16.0",
    "aiosqlite==0.22.1",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "packaging==26.2",
    "httpx==0.28.1",
]

[dependency-groups]
dev = ["httpx2"]

[tool.uv]
package = false
