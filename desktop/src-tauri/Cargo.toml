[package]
name = "vidgrab-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde_json.workspace = true
vidgrab-supervisor.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
gtk = "0.18"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_UI_Controls_Dialogs", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
