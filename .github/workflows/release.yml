name: VidGrab Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release semantic version (e.g. 0.1.0; empty infers from tag)"
        required: false
        default: ""
      channel:
        description: "Update channel (stable or beta)"
        required: true
        type: choice
        default: stable
        options:
          - stable
          - beta

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package-extensions:
    name: Build & Verify Browser Extensions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Package deterministic Chrome & Firefox archives
        env:
          VIDGRAB_CHROME_KEY: ${{ vars.VIDGRAB_CHROME_KEY }}
          VIDGRAB_FIREFOX_ID: ${{ vars.VIDGRAB_FIREFOX_ID }}
        run: |
          .venv/bin/python packaging/package_extension.py --output release-extensions
          .venv/bin/python -m unittest tests.test_extension_packaging -v
      - uses: actions/upload-artifact@v4
        with:
          name: release-extensions
          path: release-extensions/*

  build-linux:
    name: Build Linux x86_64 (.deb, AppImage & Update Bundle)
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine release version & channel
        id: meta
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['version'])")
          fi
          CHAN="${{ inputs.channel }}"
          if [ -z "$CHAN" ]; then CHAN="stable"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "channel=$CHAN" >> "$GITHUB_OUTPUT"

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf \
            file squashfs-tools desktop-file-utils binutils dpkg-dev libfuse2t64

      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group packaging
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Build desktop frontend & frozen engine
        env:
          VIDGRAB_UPDATE_PUBLIC_KEY: ${{ vars.VIDGRAB_UPDATE_PUBLIC_KEY }}
          VIDGRAB_UPDATE_MANIFEST_URL_LINUX: ${{ vars.VIDGRAB_UPDATE_MANIFEST_URL_LINUX }}
          VIDGRAB_RELEASE_BASE_URL: ${{ vars.VIDGRAB_RELEASE_BASE_URL }}
          VIDGRAB_CHROME_ORIGIN: ${{ vars.VIDGRAB_CHROME_ORIGIN }}
          VIDGRAB_FIREFOX_ID: ${{ vars.VIDGRAB_FIREFOX_ID }}
        run: |
          if [ -n "${VIDGRAB_UPDATE_MANIFEST_URL_LINUX:-}" ]; then
            export VIDGRAB_UPDATE_MANIFEST_URL="$VIDGRAB_UPDATE_MANIFEST_URL_LINUX"
          elif [ -n "${VIDGRAB_RELEASE_BASE_URL:-}" ]; then
            export VIDGRAB_UPDATE_MANIFEST_URL="${VIDGRAB_RELEASE_BASE_URL%/}/vidgrab-update-manifest-linux-x86_64.json"
          fi
          cargo fetch --locked
          npm --prefix desktop ci --ignore-scripts
          npm --prefix desktop run build
          mkdir -p packaging/out/cache packaging/out/tools release-linux
          .venv/bin/python packaging/fetch_components.py \
            --lock packaging/components.lock.json \
            --cache packaging/out/cache \
            --output packaging/out/tools
          .venv/bin/python packaging/stage_spike.py \
            --components packaging/out/tools \
            --output packaging/out/linux-stage \
            --data-dir /tmp/vidgrab-rel-data \
            --download-dir /tmp/vidgrab-rel-downloads
          .venv/bin/python packaging/prepare_desktop.py \
            --bundle packaging/out/linux-stage \
            --target x86_64-unknown-linux-gnu
          .venv/bin/python packaging/check_abi.py --tree packaging/out/linux-stage --max-glibc 2.39
          APPIMAGE_EXTRACT_AND_RUN=1 npx --prefix desktop tauri build --no-sign --config "$PWD/packaging/ubuntu24.bundle.json" --bundles deb,appimage
          APPDIR=$(find target/release/bundle/appimage -maxdepth 1 -name "*.AppDir" | head -n 1)
          RAW_APPIMAGE=$(find target/release/bundle/appimage -maxdepth 1 -name "*.AppImage" | head -n 1)
          .venv/bin/python packaging/prepare_appimage.py \
            --appdir "$APPDIR" \
            --bundle packaging/out/linux-stage \
            --output packaging/out/final.AppDir \
            --max-glibc 2.39
          PLUGIN_APPIMAGE=$(find "${XDG_CACHE_HOME:-$HOME/.cache}/tauri" -maxdepth 2 -name "*linuxdeploy-plugin-appimage*.AppImage" | head -n 1)
          TOOL_DIR=$(mktemp -d)
          (cd "$TOOL_DIR" && APPIMAGE_EXTRACT_AND_RUN=1 "$PLUGIN_APPIMAGE" --appimage-extract >/dev/null)
          OFFSET=$(APPIMAGE_EXTRACT_AND_RUN=1 "$RAW_APPIMAGE" --appimage-offset)
          head -c "$OFFSET" "$RAW_APPIMAGE" > "$TOOL_DIR/runtime"
          ARCH=x86_64 \
            PATH="$TOOL_DIR/squashfs-root/usr/bin:$PATH" \
            LD_LIBRARY_PATH="$TOOL_DIR/squashfs-root/usr/lib:${LD_LIBRARY_PATH:-}" \
            APPIMAGE_EXTRACT_AND_RUN=1 \
            "$TOOL_DIR/squashfs-root/usr/bin/appimagetool" --no-appstream --runtime-file "$TOOL_DIR/runtime" packaging/out/final.AppDir packaging/out/VidGrab-final.AppImage
          chmod +x packaging/out/VidGrab-final.AppImage
          rm -rf "$TOOL_DIR"

      - name: Verify installers & package engine update bundle
        env:
          VIDGRAB_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.VIDGRAB_UPDATE_PRIVATE_KEY_HEX }}
        run: |
          DEB_PATH=$(find target/release/bundle/deb -name "*.deb" | head -n 1)
          APPIMAGE_PATH="packaging/out/VidGrab-final.AppImage"
          .venv/bin/python tests/check_linux_package.py --deb "$DEB_PATH"
          .venv/bin/python tests/check_appimage_package.py --appimage "$APPIMAGE_PATH" --max-glibc 2.39
          cp "$DEB_PATH" "release-linux/VidGrab_${{ steps.meta.outputs.version }}_amd64.deb"
          cp "$APPIMAGE_PATH" "release-linux/VidGrab_${{ steps.meta.outputs.version }}_amd64.AppImage"
          BUNDLE_TAR="release-linux/vidgrab-engine-${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz"
          BUNDLE_META=$(.venv/bin/python packaging/release_manifest.py bundle \
            --engine-dir packaging/out/linux-stage/engine \
            --out "$BUNDLE_TAR" \
            --format tar.gz)
          NOTICES_SHA=$(python3 -c 'import json,sys; print(json.loads(sys.argv[1])["third_party_notices_sha256"])' "$BUNDLE_META")
          echo "Packaged engine update bundle (notices SHA-256: $NOTICES_SHA)"
          if [ -n "${VIDGRAB_UPDATE_SIGNING_PRIVATE_KEY:-}" ]; then
            BASE_URL="${{ vars.VIDGRAB_RELEASE_BASE_URL || format('{0}/{1}/releases/latest/download', github.server_url, github.repository) }}"
            BASE_URL="${BASE_URL%/}"
            .venv/bin/python packaging/release_manifest.py sign \
              --version "${{ steps.meta.outputs.version }}" \
              --channel "${{ steps.meta.outputs.channel }}" \
              --platform linux-x86_64 \
              --url "${BASE_URL}/vidgrab-engine-${{ steps.meta.outputs.version }}-linux-x86_64.tar.gz" \
              --archive "$BUNDLE_TAR" \
              --notices-sha256 "$NOTICES_SHA" \
              --key-env VIDGRAB_UPDATE_SIGNING_PRIVATE_KEY \
              --out release-linux/vidgrab-update-manifest-linux-x86_64.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-linux/*

  build-windows:
    name: Build Windows x64 (NSIS & Update Bundle)
    runs-on: windows-2022
    needs: build-linux
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group packaging
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Build Windows desktop, NSIS installer & update bundle
        shell: pwsh
        env:
          VIDGRAB_UPDATE_PUBLIC_KEY: ${{ vars.VIDGRAB_UPDATE_PUBLIC_KEY }}
          VIDGRAB_UPDATE_MANIFEST_URL_WINDOWS: ${{ vars.VIDGRAB_UPDATE_MANIFEST_URL_WINDOWS }}
          VIDGRAB_RELEASE_BASE_URL: ${{ vars.VIDGRAB_RELEASE_BASE_URL }}
          VIDGRAB_CHROME_ORIGIN: ${{ vars.VIDGRAB_CHROME_ORIGIN }}
          VIDGRAB_FIREFOX_ID: ${{ vars.VIDGRAB_FIREFOX_ID }}
          VIDGRAB_UPDATE_SIGNING_PRIVATE_KEY: ${{ secrets.VIDGRAB_UPDATE_PRIVATE_KEY_HEX }}
        run: |
          if ($env:VIDGRAB_UPDATE_MANIFEST_URL_WINDOWS) {
            $env:VIDGRAB_UPDATE_MANIFEST_URL = $env:VIDGRAB_UPDATE_MANIFEST_URL_WINDOWS
          } elseif ($env:VIDGRAB_RELEASE_BASE_URL) {
            $base = $env:VIDGRAB_RELEASE_BASE_URL.TrimEnd('/')
            $env:VIDGRAB_UPDATE_MANIFEST_URL = "$base/vidgrab-update-manifest-windows-x64.json"
          }
          cargo fetch --locked
          npm --prefix desktop ci --ignore-scripts
          npm --prefix desktop run build
          New-Item -ItemType Directory -Force -Path packaging/out/cache, packaging/out/tools, release-windows | Out-Null
          .venv/Scripts/python.exe packaging/fetch_components.py `
            --lock packaging/windows.components.lock.json `
            --cache packaging/out/cache `
            --output packaging/out/tools
          .venv/Scripts/python.exe packaging/stage_spike.py `
            --components packaging/out/tools `
            --output packaging/out/win-stage `
            --data-dir C:\Temp\vidgrab-rel-data `
            --download-dir C:\Temp\vidgrab-rel-downloads
          .venv/Scripts/python.exe packaging/prepare_desktop.py `
            --bundle packaging/out/win-stage `
            --target x86_64-pc-windows-msvc
          $winBundleConfig = (Resolve-Path "packaging/windows.bundle.json").Path
          npx --prefix desktop tauri build --no-sign --config "$winBundleConfig" --bundles nsis
          $ver = "${{ needs.build-linux.outputs.version }}"
          $chan = "${{ needs.build-linux.outputs.channel }}"
          $nsis = Get-ChildItem -Path target/release/bundle/nsis -Filter "*.exe" | Select-Object -First 1
          Copy-Item $nsis.FullName "release-windows/VidGrab_${ver}_x64-setup.exe"
          $bundleZip = "release-windows/vidgrab-engine-${ver}-windows-x64.zip"
          $bundleMeta = .venv/Scripts/python.exe packaging/release_manifest.py bundle `
            --engine-dir packaging/out/win-stage/engine `
            --out "$bundleZip" `
            --format zip | ConvertFrom-Json
          if ($env:VIDGRAB_UPDATE_SIGNING_PRIVATE_KEY) {
            $baseUrl = "${{ vars.VIDGRAB_RELEASE_BASE_URL }}"
            if (-not $baseUrl) { $baseUrl = "${{ github.server_url }}/${{ github.repository }}/releases/latest/download" }
            $baseUrl = $baseUrl.TrimEnd('/')
            .venv/Scripts/python.exe packaging/release_manifest.py sign `
              --version "$ver" `
              --channel "$chan" `
              --platform windows-x64 `
              --url "${baseUrl}/vidgrab-engine-${ver}-windows-x64.zip" `
              --archive "$bundleZip" `
              --notices-sha256 "$($bundleMeta.third_party_notices_sha256)" `
              --key-env VIDGRAB_UPDATE_SIGNING_PRIVATE_KEY `
              --out release-windows/vidgrab-update-manifest-windows-x64.json
          }

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-windows/*

  publish-release:
    name: Assemble Checksums & Publish Release
    runs-on: ubuntu-24.04
    needs: [package-extensions, build-linux, build-windows]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate unified SHA256SUMS.txt
        run: |
          cd dist-release
          rm -f SHA256SUMS.txt
          sha256sum * | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: vidgrab-release-bundle
          path: dist-release/*

      - name: Create GitHub Release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
